<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liquid Glass Template</title>
    <link rel="stylesheet" href="./styles.css?v=20260708-ci-contrast">
  </head>
  <body>
    <svg id="lg-filter-bank" class="lg-filter-root" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <defs></defs>
    </svg>

    <main class="app-shell">
      <section class="visual-stage" data-lg-role="stage" data-scene="aurora" aria-label="Liquid Glass control demo">
        <div class="scene-layers" aria-hidden="true">
          <span class="aurora-glow glow-a"></span>
          <span class="aurora-glow glow-b"></span>
          <span class="aurora-glow glow-c"></span>
          <div class="photo-grain"></div>
          <div class="contour-map"></div>
          <div class="signal-strips"></div>
          <div class="depth-card"></div>
        </div>

        <header class="top-strip" aria-label="Scene controls">
          <button class="lg-surface lg-button is-active" data-scene-button="aurora" data-lg-refraction data-lg-profile="thin" data-lg-strength="112" data-lg-magnify="1.06" data-lg-dispersion="0.014"><span>Aurora</span></button>
          <button class="lg-surface lg-button" data-scene-button="noir" data-lg-refraction data-lg-profile="thin" data-lg-strength="112" data-lg-magnify="1.06" data-lg-dispersion="0.014"><span>Noir</span></button>
          <button class="lg-surface lg-button" data-scene-button="flux" data-lg-refraction data-lg-profile="thin" data-lg-strength="112" data-lg-magnify="1.06" data-lg-dispersion="0.014"><span>Flux</span></button>
        </header>

        <section class="hero-copy" aria-hidden="true">
          <p>Liquid Glass System</p>
          <h1>Optic Deck</h1>
          <span>precision controls with calibrated edge refraction</span>
        </section>

        <article class="lg-surface lg-panel media-card" data-lg-role="focus" data-lg-refraction data-lg-profile="prominent" data-lg-strength="164" data-lg-magnify="1.28" data-lg-glare="0.72" data-lg-dispersion="0.052">
          <div class="media-topline">
            <span>Now Rendering</span>
            <strong>Liquid Pass 04</strong>
          </div>
          <div class="cover-art" aria-hidden="true">
            <span></span>
          </div>
          <div class="cover-slider" aria-hidden="true"></div>
          <div class="equalizer" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
        </article>

        <section class="insight-rail" data-lg-role="rail" aria-label="Glass samples">
          <aside class="lg-surface lg-panel status-panel lg-tinted" data-lg-refraction data-lg-profile="soft" data-lg-strength="136" data-lg-magnify="1.12" data-lg-glare="0.6" data-lg-dispersion="0.024">
            <p class="label">Current Layer</p>
            <strong>Refraction</strong>
            <span>96%</span>
          </aside>
          <article class="lg-surface lg-panel metric-card" data-lg-refraction data-lg-profile="prominent" data-lg-strength="140" data-lg-magnify="1.14" data-lg-glare="0.64" data-lg-dispersion="0.028">
            <p class="label">Rim Depth</p>
            <strong>1.46</strong>
            <span class="sparkline" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          </article>
          <article class="lg-surface lg-panel compact-card" data-lg-refraction data-lg-profile="thin" data-lg-strength="126" data-lg-magnify="1.08" data-lg-glare="0.6" data-lg-dispersion="0.022">
            <p class="label">Glare</p>
            <strong>62%</strong>
          </article>
        </section>

        <nav class="lg-surface lg-panel transport-bar" data-lg-role="dock" data-lg-refraction data-lg-profile="soft" data-lg-strength="144" data-lg-magnify="1.12" data-lg-glare="0.72" data-lg-dispersion="0.006" aria-label="Playback controls">
          <div class="track-meta">
            <div class="mini-cover" aria-hidden="true"></div>
            <div>
              <strong>Glass Channel</strong>
              <span>Live optical surface</span>
            </div>
          </div>

          <div class="transport-actions">
            <button class="lg-surface lg-button icon-button" data-lg-refraction data-lg-profile="thin" data-lg-strength="118" data-lg-magnify="1.06" data-lg-dispersion="0.014" aria-label="Previous"><span aria-hidden="true">Prev</span></button>
            <button class="lg-surface lg-button play-button" data-lg-refraction data-lg-profile="prominent" data-lg-strength="148" data-lg-magnify="1.16" data-lg-glare="0.78" data-lg-dispersion="0.028" aria-label="Play"><span aria-hidden="true">Play</span></button>
            <button class="lg-surface lg-button icon-button" data-lg-refraction data-lg-profile="thin" data-lg-strength="118" data-lg-magnify="1.06" data-lg-dispersion="0.014" aria-label="Next"><span aria-hidden="true">Next</span></button>
          </div>

          <div class="progress" aria-hidden="true"><i></i></div>

          <button class="lg-surface lg-button mode-button lg-clear is-active" data-lg-refraction data-lg-profile="thin" data-lg-strength="118" data-lg-magnify="1.06" data-lg-dispersion="0.014"><span>Clear</span></button>
        </nav>
      </section>
    </main>

    <script type="module" src="./liquid-glass.js?v=20260708-ci-contrast"></script>
  </body>
</html>
