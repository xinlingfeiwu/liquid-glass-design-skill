<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liquid Glass Template</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <svg id="lg-filter-bank" class="lg-filter-root" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <defs></defs>
    </svg>

    <main class="app-shell">
      <section class="visual-stage" aria-label="Liquid Glass control demo">
        <div class="scene-layers" aria-hidden="true">
          <span class="sun-disc"></span>
          <div class="detail-rings"></div>
          <div class="detail-dots"></div>
          <span class="blob blob-a"></span>
          <span class="blob blob-b"></span>
          <div class="horizon-lines"></div>
        </div>

        <header class="top-strip" aria-label="Primary controls">
          <button class="lg-surface lg-button" data-lg-refraction data-lg-profile="thin" data-lg-strength="118" data-lg-magnify="1.08">Library</button>
          <button class="lg-surface lg-button is-active" data-lg-refraction data-lg-profile="thin" data-lg-strength="124" data-lg-magnify="1.1">Now</button>
          <button class="lg-surface lg-button" data-lg-refraction data-lg-profile="thin" data-lg-strength="118" data-lg-magnify="1.08">Scene</button>
        </header>

        <section class="lyric-stack" aria-hidden="true">
          <p>warm light across the valley</p>
          <h1>Day Trip</h1>
          <p>colors folding into motion</p>
        </section>

        <aside class="lg-surface lg-panel lg-tinted status-panel" data-lg-refraction data-lg-profile="soft" data-lg-strength="128" data-lg-magnify="1.12" data-lg-glare="0.60">
          <p class="label">Current Layer</p>
          <strong>Atmosphere</strong>
          <span>82%</span>
        </aside>

        <nav class="lg-surface lg-panel transport-bar" data-lg-refraction data-lg-profile="prominent" data-lg-strength="148" data-lg-magnify="1.24" data-lg-glare="0.64" data-lg-dispersion="0.10" aria-label="Playback controls">
          <div class="track-meta">
            <div class="mini-cover" aria-hidden="true"></div>
            <div>
              <strong>Day Trip</strong>
              <span>Studio channel</span>
            </div>
          </div>

          <div class="transport-actions">
            <button class="lg-surface lg-button icon-button" data-lg-refraction data-lg-profile="thin" data-lg-strength="120" data-lg-magnify="1.1" aria-label="Previous"><span aria-hidden="true">Prev</span></button>
            <button class="lg-surface lg-button play-button" data-lg-refraction data-lg-profile="prominent" data-lg-strength="140" data-lg-magnify="1.2" data-lg-glare="0.74" data-lg-dispersion="0.11" aria-label="Play"><span aria-hidden="true">Play</span></button>
            <button class="lg-surface lg-button icon-button" data-lg-refraction data-lg-profile="thin" data-lg-strength="120" data-lg-magnify="1.1" aria-label="Next"><span aria-hidden="true">Next</span></button>
          </div>

          <div class="progress" aria-hidden="true"><i></i></div>

          <button class="lg-surface lg-button mode-button lg-clear is-active" data-lg-refraction data-lg-profile="thin" data-lg-strength="124" data-lg-magnify="1.1">Clear</button>
        </nav>
      </section>
    </main>

    <script type="module" src="./liquid-glass.js"></script>
  </body>
</html>
