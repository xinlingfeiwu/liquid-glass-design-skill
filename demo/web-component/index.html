<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liquid Glass Web Component</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: #fff;
        background:
          radial-gradient(circle at 20% 16%, rgba(54, 211, 224, .34), transparent 32%),
          radial-gradient(circle at 76% 24%, rgba(150, 110, 255, .34), transparent 36%),
          radial-gradient(circle at 70% 78%, rgba(255, 187, 96, .2), transparent 32%),
          linear-gradient(135deg, #071016 0%, #111521 50%, #05070d 100%);
        overflow: hidden;
      }

      .stage {
        position: relative;
        min-height: calc(100vh - 48px);
        margin: 24px;
        overflow: hidden;
        border-radius: 42px;
        background:
          repeating-linear-gradient(90deg, transparent 0 72px, rgba(255, 255, 255, .1) 72px 73px),
          repeating-linear-gradient(0deg, transparent 0 58px, rgba(255, 255, 255, .06) 58px 59px);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, .1),
          inset 0 -90px 170px rgba(0, 0, 0, .42),
          0 40px 130px rgba(0, 0, 0, .58);
      }

      .stage::before,
      .stage::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .stage::before {
        background-image: radial-gradient(circle, rgba(255, 255, 255, .72) 1px, transparent 1.7px);
        background-size: 52px 52px;
        opacity: .12;
      }

      .stage::after {
        left: 45%;
        top: 11%;
        width: 44%;
        height: 70%;
        border-radius: 42px;
        background:
          repeating-linear-gradient(104deg, rgba(255, 255, 255, .14) 0 1px, transparent 1px 24px),
          radial-gradient(circle at 42% 34%, rgba(255, 255, 255, .18), transparent 26%);
        opacity: .28;
        transform: perspective(1000px) rotateX(4deg) rotateY(-8deg);
      }

      .hero {
        position: absolute;
        left: 8%;
        top: 28%;
        width: min(440px, 40vw);
      }

      .hero p {
        margin: 0 0 20px;
        color: rgba(221, 241, 255, .72);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(74px, 8vw, 132px);
        line-height: .88;
        letter-spacing: 0;
      }

      .deck {
        position: absolute;
        right: 8%;
        top: 16%;
        width: min(560px, 42vw);
        min-height: 520px;
        padding: 44px;
      }

      .deck header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        color: rgba(16, 26, 39, .88);
        font-weight: 800;
      }

      .meter {
        height: 260px;
        margin: 52px 0 46px;
        border-radius: 34px;
        background:
          radial-gradient(circle at 29% 32%, rgba(255, 255, 255, .7), transparent 9%),
          conic-gradient(from -90deg at 50% 50%, #54d3e9, #f5d66b, #e776a8, #5e6dff, #05243b, #54d3e9);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2);
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(3, minmax(84px, 1fr));
        gap: 16px;
      }

      .actions liquid-glass {
        min-height: 64px;
        display: grid;
        place-items: center;
        font-size: 18px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main class="stage" data-lg-role="stage">
      <section class="hero">
        <p>Liquid Glass Custom Element</p>
        <h1>Lens<br>Card</h1>
      </section>

      <liquid-glass class="deck" data-lg-role="focus" radius="42" profile="prominent" strength="158" magnify="1.22" dispersion="0.044" tint="rgba(26, 32, 44, .28)" adaptive>
        <header>
          <span>Now Rendering</span>
          <strong>Web Component</strong>
        </header>
        <div class="meter" aria-hidden="true"></div>
        <div class="actions" data-lg-role="dock">
          <liquid-glass radius="32" profile="thin" strength="118" dispersion="0.014" adaptive interactive>Vue</liquid-glass>
          <liquid-glass radius="32" profile="thin" strength="118" dispersion="0.014" adaptive interactive>Svelte</liquid-glass>
          <liquid-glass radius="32" profile="thin" strength="118" dispersion="0.014" adaptive interactive>HTML</liquid-glass>
        </div>
      </liquid-glass>
    </main>

    <script type="module" src="./liquid-glass-element.js"></script>
  </body>
</html>
