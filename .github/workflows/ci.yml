name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate skill structure
        run: npm run validate

      - name: Node syntax checks
        run: npm run check

      - name: Displacement map tests
        run: npm run test:maps

      - name: Eval smoke
        run: npm run eval

      - name: Plugin manifest validation
        run: npm run plugin:validate

      - name: Package dry run
        run: npm run package:dry

      - name: NPM package dry run
        run: npm run npm:pack

      - name: React template build
        working-directory: skills/liquid-glass-design/assets/templates/react-liquid-glass
        run: |
          npm ci
          npm run build

      - name: Install Playwright for visual QA
        run: |
          npm install --no-save playwright@^1.53.0
          npx playwright install --with-deps chromium webkit

      - name: Vanilla template visual QA
        run: |
          set -euo pipefail
          mkdir -p artifacts/screenshots
          python3 -m http.server 4173 --directory skills/liquid-glass-design/assets/templates/vanilla-liquid-glass > /tmp/liquid-glass-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.5
          done
          node skills/liquid-glass-design/scripts/check-visual-geometry.mjs \
            --url http://127.0.0.1:4173/ \
            --browser chromium \
            --expect-svg-filter enabled \
            --screenshot-dir artifacts/screenshots \
            --baseline-dir skills/liquid-glass-design/evals/baselines \
            --full-page \
            --pixel-channel-threshold 24 \
            --roi-roles dock,focus \
            --roi-baseline-only \
            --roi-pixel-threshold 0.08 \
            --reduced-motion \
            --adaptive \
            --contrast \
            --min-contrast 4.5
          node skills/liquid-glass-design/scripts/check-visual-geometry.mjs \
            --url http://127.0.0.1:4173/ \
            --browser webkit \
            --expect-svg-filter disabled \
            --viewport 1440x900 \
            --screenshot-dir artifacts/screenshots \
            --adaptive \
            --contrast \
            --min-contrast 4.5
          node skills/liquid-glass-design/scripts/check-visual-geometry.mjs \
            --url http://127.0.0.1:4173/ \
            --browser webkit \
            --force-fallback \
            --expect-svg-filter disabled \
            --viewport 1440x900 \
            --screenshot-dir artifacts/screenshots \
            --adaptive \
            --contrast \
            --min-contrast 4.5

      - name: Prepare README preview artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p artifacts/preview
          node skills/liquid-glass-design/scripts/update-readme-preview.mjs \
            --source artifacts/screenshots/liquid-glass-1440x900.png \
            --target artifacts/preview/preview-latest.png

      - name: Publish README preview to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: artifacts/preview
          destination_dir: preview
          force_orphan: true
          commit_message: "docs: update preview image"

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-visual-qa
          path: artifacts/screenshots
          if-no-files-found: ignore
